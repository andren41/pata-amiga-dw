<svg viewBox="0 0 980 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="980" height="780" fill="#ffffff"/>

  <text x="490" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">Modelo Dimensional — Pata Amiga (Esquema Estrela)</text>

  <!-- ===================== CONECTORES (desenhados antes das caixas) ===================== -->
  <!-- dim_tempo -> fato (duas vezes: role-playing) -->
  <path d="M 430 190 Q 405 260 425 330" stroke="#6b7280" stroke-width="1.6" fill="none"/>
  <path d="M 550 190 Q 575 260 555 330" stroke="#6b7280" stroke-width="1.6" fill="none"/>
  <text x="392" y="264" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">data do pedido</text>
  <text x="592" y="264" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">data da entrega</text>

  <!-- dim_loja -> fato -->
  <line x1="280" y1="392" x2="350" y2="410" stroke="#6b7280" stroke-width="1.6"/>
  <!-- dim_categoria -> fato -->
  <line x1="700" y1="392" x2="630" y2="410" stroke="#6b7280" stroke-width="1.6"/>
  <!-- dim_loja -> bridge -->
  <line x1="170" y1="428" x2="170" y2="492" stroke="#6b7280" stroke-width="1.6"/>
  <!-- bridge -> dim_praca -->
  <line x1="170" y1="590" x2="170" y2="612" stroke="#6b7280" stroke-width="1.6"/>

  <text x="300" y="548" font-size="12" font-style="italic" fill="#6b7280">&#8592; único caminho indireto do modelo</text>

  <!-- ===================== DIM_TEMPO ===================== -->
  <g>
    <rect x="370" y="72" width="240" height="32" rx="4" fill="#2f6690"/>
    <text x="490" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">DIM_TEMPO</text>
    <rect x="370" y="104" width="240" height="20" fill="#4a86ad"/>
    <text x="490" y="118" text-anchor="middle" font-size="10.5" font-style="italic" fill="#ffffff">role-playing: 2 papéis na fato</text>
    <rect x="370" y="124" width="240" height="66" fill="#eaf2f8" stroke="#2f6690" stroke-width="1"/>
    <text x="382" y="140" font-size="12" fill="#1f3a5f">sk_tempo (PK)</text>
    <text x="382" y="162" font-size="12" fill="#1f3a5f">data</text>
    <text x="382" y="184" font-size="12" fill="#1f3a5f">ano_mes</text>
  </g>

  <!-- ===================== FATO_PEDIDO ===================== -->
  <g>
    <rect x="350" y="330" width="280" height="34" rx="4" fill="#1f3a5f"/>
    <text x="490" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">FATO_PEDIDO</text>
    <rect x="350" y="364" width="280" height="22" fill="#2c4f7c"/>
    <text x="490" y="379" text-anchor="middle" font-size="11" font-style="italic" fill="#ffffff">grão: 1 linha = 1 pedido</text>
    <rect x="350" y="386" width="280" height="132" fill="#eef2f7" stroke="#1f3a5f" stroke-width="1"/>
    <text x="364" y="402" font-size="12" fill="#1f3a5f">sk_pedido (PK)</text>
    <text x="364" y="424" font-size="12" fill="#1f3a5f">sk_tempo_pedido (FK)</text>
    <text x="364" y="446" font-size="12" fill="#1f3a5f">sk_tempo_entrega (FK)</text>
    <text x="364" y="468" font-size="12" fill="#1f3a5f">sk_loja (FK)</text>
    <text x="364" y="490" font-size="12" fill="#1f3a5f">sk_categoria (FK)</text>
    <text x="364" y="512" font-size="12" fill="#1f3a5f">vl_liquido · qt_itens</text>
  </g>

  <!-- ===================== DIM_LOJA ===================== -->
  <g>
    <rect x="60" y="330" width="220" height="32" rx="4" fill="#2f6690"/>
    <text x="170" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">DIM_LOJA</text>
    <rect x="60" y="362" width="220" height="66" fill="#eaf2f8" stroke="#2f6690" stroke-width="1"/>
    <text x="72" y="378" font-size="12" fill="#1f3a5f">sk_loja (PK)</text>
    <text x="72" y="400" font-size="12" fill="#1f3a5f">cod_loja</text>
    <text x="72" y="422" font-size="12" fill="#1f3a5f">chave_loja</text>
  </g>

  <!-- ===================== DIM_CATEGORIA ===================== -->
  <g>
    <rect x="700" y="330" width="220" height="32" rx="4" fill="#2f6690"/>
    <text x="810" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">DIM_CATEGORIA</text>
    <rect x="700" y="362" width="220" height="66" fill="#eaf2f8" stroke="#2f6690" stroke-width="1"/>
    <text x="712" y="378" font-size="12" fill="#1f3a5f">sk_categoria (PK)</text>
    <text x="712" y="400" font-size="12" fill="#1f3a5f">categoria_origem</text>
    <text x="712" y="422" font-size="12" fill="#1f3a5f">nome_categoria</text>
  </g>

  <!-- ===================== BRIDGE_LOJA_PRACA ===================== -->
  <g>
    <rect x="60" y="492" width="220" height="32" rx="4" fill="#d98324"/>
    <text x="170" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">BRIDGE_LOJA_PRACA</text>
    <rect x="60" y="524" width="220" height="66" fill="#fdf1e3" stroke="#d98324" stroke-width="1"/>
    <text x="72" y="540" font-size="12" fill="#7a4a12">cod_loja (FK)</text>
    <text x="72" y="562" font-size="12" fill="#7a4a12">sk_praca (FK)</text>
    <text x="72" y="584" font-size="12" fill="#7a4a12">fator_publico</text>
  </g>

  <!-- ===================== DIM_PRACA ===================== -->
  <g>
    <rect x="60" y="612" width="220" height="32" rx="4" fill="#2f6690"/>
    <text x="170" y="633" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">DIM_PRACA</text>
    <rect x="60" y="644" width="220" height="66" fill="#eaf2f8" stroke="#2f6690" stroke-width="1"/>
    <text x="72" y="660" font-size="12" fill="#1f3a5f">sk_praca (PK)</text>
    <text x="72" y="682" font-size="12" fill="#1f3a5f">cod_praca</text>
    <text x="72" y="704" font-size="12" fill="#1f3a5f">domicilios_com_pet</text>
  </g>

  <!-- ===================== LEGENDA ===================== -->
  <g>
    <rect x="300" y="730" width="16" height="16" fill="#1f3a5f"/>
    <text x="322" y="743" font-size="12" fill="#111827">Fato</text>
    <rect x="390" y="730" width="16" height="16" fill="#2f6690"/>
    <text x="412" y="743" font-size="12" fill="#111827">Dimensão</text>
    <rect x="510" y="730" width="16" height="16" fill="#d98324"/>
    <text x="532" y="743" font-size="12" fill="#111827">Tabela ponte (N:N)</text>
  </g>
</svg>
